<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>資料一覧</title>
<style>
  :root { --bg:#f5f6f8; --ink:#1b2232; --muted:#5d6678; --line:#dadee6; --accent:#f6cb3a; }
  body { margin:0; background:var(--bg); color:var(--ink); line-height:1.7;
    font-family:system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; }
  main { max-width:960px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .lead { color:var(--muted); margin:0 0 24px; font-size:14px; }
  .deck { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px 20px; align-items:center;
    padding:16px 0; border-top:1px solid var(--line); }
  .deck h2 { font-size:17px; margin:0; }
  .deck .meta { color:var(--muted); font-size:13px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { height:36px; padding:0 14px; border:1px solid var(--line); border-radius:8px; background:#fff;
    color:var(--ink); font:inherit; font-size:14px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; }
  .btn:hover { border-color:var(--muted); }
  .btn.done { background:var(--accent); border-color:var(--accent); }
  .preview { grid-column:1 / -1; }
  .preview iframe { width:100%; aspect-ratio:16 / 10; border:0; border-radius:8px; }
  .empty { color:var(--muted); padding:24px 0; border-top:1px solid var(--line); }
  code { background:#fff; border:1px solid var(--line); border-radius:4px; padding:1px 6px; font-size:13px; }
  :focus-visible { outline:2px solid #2f6fe4; outline-offset:2px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>資料一覧</h1>
  <p class="lead">Googleドライブの「HP掲載用資料」フォルダにPDFを入れると、ここに表示されます。「埋め込みコードをコピー」で自社HP用のコードを、「URLをコピー」でnote用のURLをコピーできます。</p>
  <div id="list"><p class="empty">読み込み中…</p></div>
</main>
<script src="config.js"></script>
<script>
(async function () {
  'use strict';
  const API = 'https://www.googleapis.com/drive/v3/files';
  const CFG = window.SLIDE_CONFIG || {};
  const list = document.getElementById('list');
  const base = new URL('viewer.html', location.href);

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
  function say(text) { list.replaceChildren(el('p', 'empty', text)); }

  if (!CFG.apiKey || !CFG.folderId || /ここに/.test(CFG.apiKey + CFG.folderId)) {
    say('config.js にAPIキーとフォルダIDを設定してください。'); return;
  }

  async function listFiles() {
    const files = []; let pageToken = '';
    do {
      const u = new URL(API);
      const q = {
        q: `'${CFG.folderId}' in parents and trashed = false and mimeType = 'application/pdf'`,
        fields: 'nextPageToken,files(id,name,modifiedTime)', orderBy: 'modifiedTime desc', pageSize: '200',
        supportsAllDrives: 'true', includeItemsFromAllDrives: 'true', key: CFG.apiKey
      };
      if (pageToken) q.pageToken = pageToken;
      u.search = new URLSearchParams(q);
      const r = await fetch(u);
      if (!r.ok) { const e = new Error('api'); e.status = r.status; throw e; }
      const j = await r.json();
      files.push(...(j.files || [])); pageToken = j.nextPageToken || '';
    } while (pageToken && files.length < 1000);
    // 同じ名前のファイルが複数あるときは新しい方だけ表示
    const seen = new Set();
    return files.filter((f) => !seen.has(f.name) && seen.add(f.name));
  }

  let files;
  try { files = await listFiles(); }
  catch (e) {
    say(e.status === 404 ? 'フォルダが見つかりません。config.js のフォルダIDを確認してください。'
      : (e.status === 403 || e.status === 400) ? 'Googleドライブに接続できませんでした。APIキーの制限設定（ウェブサイト・API）を確認してください。'
      : 'Googleドライブに接続できませんでした。時間をおいて再読み込みしてください。');
    return;
  }
  if (!files.length) {
    say('PDFがありません。フォルダにPDFが入っているか、フォルダの共有設定が「リンクを知っている全員」になっているか確認してください。');
    return;
  }

  function viewerUrl(f) { const u = new URL(base); u.searchParams.set('name', f.name); return u.href; }
  function embedCode(f) {
    const t = f.name.replace(/\.pdf$/i, '').replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    return '<iframe src="' + viewerUrl(f).replace(/&/g, '&amp;') + '" title="' + t + '"'
      + ' style="width:100%;aspect-ratio:16/10;border:0;" allow="fullscreen" allowfullscreen loading="lazy"></iframe>';
  }
  async function copy(text, btn, label) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) { window.prompt('コピーしてください', text); return; }
    btn.textContent = 'コピーしました'; btn.classList.add('done');
    setTimeout(() => { btn.textContent = label; btn.classList.remove('done'); }, 1800);
  }
  const fmt = (iso) => { const d = new Date(iso); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

  list.replaceChildren();
  for (const f of files) {
    const row = el('section', 'deck');
    const info = el('div');
    info.append(el('h2', null, f.name.replace(/\.pdf$/i, '')), el('div', 'meta', '更新日 ' + fmt(f.modifiedTime)));
    const actions = el('div', 'actions');
    const open = el('a', 'btn', '表示'); open.href = viewerUrl(f); open.target = '_blank'; open.rel = 'noopener';
    const embed = el('button', 'btn', '埋め込みコードをコピー'); embed.type = 'button';
    embed.onclick = () => copy(embedCode(f), embed, '埋め込みコードをコピー');
    const url = el('button', 'btn', 'URLをコピー'); url.type = 'button';
    url.onclick = () => copy(viewerUrl(f), url, 'URLをコピー');
    const prev = el('button', 'btn', 'プレビュー'); prev.type = 'button'; prev.setAttribute('aria-expanded', 'false');
    const box = el('div', 'preview'); box.hidden = true;
    prev.onclick = () => {
      if (box.hidden && !box.firstChild) {
        const fr = document.createElement('iframe');
        fr.src = viewerUrl(f); fr.title = f.name; fr.allow = 'fullscreen'; fr.setAttribute('allowfullscreen', '');
        box.append(fr);
      }
      box.hidden = !box.hidden; prev.setAttribute('aria-expanded', String(!box.hidden));
    };
    actions.append(open, embed, url, prev);
    row.append(info, actions, box);
    list.append(row);
  }
})();
</script>
</body>
</html>
