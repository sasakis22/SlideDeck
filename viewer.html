<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スライド</title>
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden;
    font-family:system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; }
  .app { position:relative; height:100%; display:flex; align-items:center; justify-content:center;
    touch-action:pan-y; user-select:none; -webkit-user-select:none; }
  :fullscreen .app, .app:fullscreen { background:#000; }
  .slide { position:relative; display:none; }
  .slide.ready { display:block; }
  .slide canvas { display:block; background:#fff; }
  .hit { position:absolute; top:0; bottom:0; width:30%; background:none; border:0; padding:0; z-index:1; }
  .hit.prev { left:0; cursor:w-resize; } .hit.next { right:0; cursor:e-resize; }
  .msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:16px; color:#6b7280; font-size:14px; line-height:1.7; background:#f3f4f6; }
  /* 操作ボタン：マウスを乗せたとき・タップしたときだけ表示 */
  .controls { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); z-index:2;
    display:flex; align-items:center; gap:2px; padding:4px 6px; border-radius:999px;
    background:rgba(17,24,39,.78); color:#fff; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .2s; }
  .app:hover .controls, .app:focus-within .controls, .app.ui .controls { opacity:1; pointer-events:auto; }
  .controls button, .controls a { display:inline-flex; align-items:center; justify-content:center;
    width:32px; height:32px; border:0; border-radius:999px; background:transparent; color:#fff;
    cursor:pointer; text-decoration:none; }
  .controls button:hover:not(:disabled), .controls a:hover { background:rgba(255,255,255,.16); }
  .controls button:disabled { opacity:.35; cursor:default; }
  .controls svg { width:18px; height:18px; }
  .count { font-variant-numeric:tabular-nums; min-width:56px; text-align:center; }
  .sep { width:1px; height:18px; background:rgba(255,255,255,.25); margin:0 4px; }
  .progress { position:absolute; left:0; right:0; bottom:0; height:3px; z-index:2; pointer-events:none; }
  .progress i { display:block; height:100%; width:0; background:rgba(17,24,39,.55); transition:width .15s; }
  :focus-visible { outline:2px solid #3b82f6; outline-offset:1px; }
  [hidden] { display:none !important; }
  @media (prefers-reduced-motion: reduce) { .controls, .progress i { transition:none; } }
</style>
</head>
<body>
<div class="app" id="stage">
  <div class="msg" id="msg">読み込み中…</div>
  <button class="hit prev" id="hitPrev" aria-label="前のページ" hidden></button>
  <button class="hit next" id="hitNext" aria-label="次のページ" hidden></button>
  <div class="slide" id="slide">
  <div class="controls" id="controls">
    <button id="prev" aria-label="前のページ" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="count" id="count" aria-live="polite">– / –</span>
    <button id="next" aria-label="次のページ" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <a id="openNew" aria-label="新しいタブで開く" title="新しいタブで開く" target="_blank" rel="noopener" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>
    </a>
    <button id="full" aria-label="全画面表示" title="全画面表示（F）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
  <div class="progress" aria-hidden="true"><i id="progress"></i></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="config.js"></script>
<script>
(async function () {
  'use strict';
  const CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  const API = 'https://www.googleapis.com/drive/v3/files';
  const CFG = window.SLIDE_CONFIG || {};
  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), msg = $('msg');
  const params = new URLSearchParams(location.search);
  const name = params.get('name');
  const inIframe = window.self !== window.top;

  function showMessage(text) { msg.textContent = text; msg.hidden = false; }

  if (!CFG.apiKey || !CFG.folderId || /ここに/.test(CFG.apiKey + CFG.folderId)) {
    showMessage('config.js にAPIキーとフォルダIDが設定されていません。'); return;
  }
  if (!name) { showMessage('表示する資料が指定されていません。資料一覧からURLをコピーしてください。'); return; }
  if (!window.pdfjsLib) { showMessage('ビューアの部品を読み込めませんでした。ページを再読み込みしてください。'); return; }

  // 指定フォルダの中から、ファイル名が一致する最新のPDFを探す
  async function findFile(fileName) {
    const esc = fileName.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    const u = new URL(API);
    u.search = new URLSearchParams({
      q: `'${CFG.folderId}' in parents and name = '${esc}' and trashed = false`,
      fields: 'files(id,name,modifiedTime)', orderBy: 'modifiedTime desc', pageSize: '1',
      supportsAllDrives: 'true', includeItemsFromAllDrives: 'true', key: CFG.apiKey
    });
    const r = await fetch(u);
    if (!r.ok) { const e = new Error('api'); e.status = r.status; throw e; }
    return ((await r.json()).files || [])[0] || null;
  }

  let found;
  try { found = await findFile(name); }
  catch (e) {
    showMessage(e.status === 403 || e.status === 400
      ? 'Googleドライブに接続できませんでした。APIキーの制限設定を確認してください。'
      : 'Googleドライブに接続できませんでした。時間をおいて再読み込みしてください。');
    return;
  }
  if (!found) { showMessage('「' + name + '」が見つかりません。ファイル名が変わったか、削除された可能性があります。'); return; }

  pdfjsLib.GlobalWorkerOptions.workerSrc = CDN + 'pdf.worker.min.js';
  let pdf;
  try {
    const task = pdfjsLib.getDocument({
      url: `${API}/${found.id}?alt=media&supportsAllDrives=true&key=${encodeURIComponent(CFG.apiKey)}`,
      disableRange: true, disableStream: true,
      cMapUrl: CDN + 'cmaps/', cMapPacked: true,            // 日本語フォントを埋め込んでいないPDF向け
      standardFontDataUrl: CDN + 'standard_fonts/'
    });
    task.onProgress = (p) => { if (p.total) $('progress').style.width = Math.round(p.loaded / p.total * 100) + '%'; };
    pdf = await task.promise;
  } catch (e) {
    showMessage(e && e.name === 'PasswordException'
      ? 'パスワード付きのPDFは表示できません。'
      : 'PDFを開けませんでした。フォルダの共有設定が「リンクを知っている全員」になっているか確認してください。');
    return;
  }

  const total = pdf.numPages;
  let page = Math.min(Math.max(1, parseInt(params.get('page') || '1', 10) || 1), total);
  let canvas = null, renderTask = null, renderSeq = 0;

  const title = found.name.replace(/\.pdf$/i, '');
  document.title = title;

  if (inIframe) { $('openNew').href = location.href; $('openNew').hidden = false; }
  $('hitPrev').hidden = false; $('hitNext').hidden = false;

  async function render() {
    const seq = ++renderSeq;
    if (renderTask) { try { renderTask.cancel(); } catch (e) {} }
    const p = await pdf.getPage(page);
    if (seq !== renderSeq) return;
    const base = p.getViewport({ scale: 1 });
    const pad = 0;
    const fit = Math.min((stage.clientWidth - pad) / base.width, (stage.clientHeight - pad) / base.height);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vp = p.getViewport({ scale: fit * dpr });
    const c = document.createElement('canvas');
    c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    c.style.width = Math.floor(vp.width / dpr) + 'px';
    c.style.height = Math.floor(vp.height / dpr) + 'px';
    c.setAttribute('role', 'img');
    c.setAttribute('aria-label', title + '（' + page + 'ページ目）');
    renderTask = p.render({ canvasContext: c.getContext('2d'), viewport: vp });
    try { await renderTask.promise; } catch (e) { return; } // 次のページ操作でキャンセルされた
    if (seq !== renderSeq) return;
    if (canvas) canvas.replaceWith(c); else { $('slide').prepend(c); $('slide').classList.add('ready'); }
    canvas = c;
    msg.hidden = true;
    if (page < total) pdf.getPage(page + 1); // 次ページを先読み
  }

  function go(n) {
    n = Math.min(Math.max(1, n), total);
    if (n === page && canvas) return;
    page = n;
    $('count').textContent = page + ' / ' + total;
    $('prev').disabled = page === 1;
    $('next').disabled = page === total;
    $('progress').style.width = (page / total * 100) + '%';
    try {
      const u = new URL(location.href); u.searchParams.set('page', page);
      history.replaceState(null, '', u);
      if (inIframe) $('openNew').href = u.href;
    } catch (e) {}
    render();
  }

  $('prev').addEventListener('click', () => go(page - 1));
  $('next').addEventListener('click', () => go(page + 1));
  $('hitPrev').addEventListener('click', () => go(page - 1));
  $('hitNext').addEventListener('click', () => go(page + 1));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(page + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(page - 1); }
    else if (e.key === 'Home') go(1);
    else if (e.key === 'End') go(total);
    else if (e.key === 'f' || e.key === 'F') toggleFull();
  });

  // タッチ操作やキー操作のとき、操作ボタンを少しの間表示する
  let uiTimer;
  function flashUI() { stage.classList.add('ui'); clearTimeout(uiTimer); uiTimer = setTimeout(() => stage.classList.remove('ui'), 2500); }
  stage.addEventListener('touchstart', flashUI, { passive: true });
  document.addEventListener('keydown', flashUI);
  flashUI();

  // スライド画像の右クリック保存を無効化
  stage.addEventListener('contextmenu', (e) => e.preventDefault());

  // スマホのスワイプ
  let sx = null;
  stage.addEventListener('pointerdown', (e) => { sx = e.clientX; });
  stage.addEventListener('pointerup', (e) => {
    if (sx === null) return;
    const dx = e.clientX - sx; sx = null;
    if (Math.abs(dx) > 50) go(page + (dx < 0 ? 1 : -1));
  });

  function toggleFull() {
    const el = stage;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen().catch(() => {
      if (inIframe) window.open(location.href, '_blank', 'noopener'); // 埋め込み先が全画面を許可していない場合
    });
  }
  $('full').addEventListener('click', toggleFull);

  let resizeTimer;
  new ResizeObserver(() => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 120); }).observe(stage);

  const first = page; page = 0; go(first); // 初期表示
})();
</script>
</body>
</html>
